<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChanneLLM 语音对话</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0d1117; color: #eee;
         display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 12px;
         max-width: 560px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 4px 0; }
  .state { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 24px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #555; flex: none; }
  .dot.connecting { background: #e6a23c; }
  .dot.listening { background: #41d17a; }
  .dot.speaking { background: #2d7ff9; animation: pulse 0.9s infinite alternate; }
  .dot.error { background: #e5484d; }
  @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.5); opacity: 0.55; } }
  button { font-size: 17px; padding: 13px 44px; border-radius: 30px; border: none;
           background: #2d7ff9; color: white; cursor: pointer; }
  button.stop { background: #d9534f; }
  #reply { font-size: 16px; line-height: 1.5; min-height: 48px; width: 100%; text-align: center;
           color: #d8ffe8; background: #132018; border-radius: 12px; padding: 10px 14px; }
  .bars { width: 100%; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8b949e; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { width: 64px; flex: none; text-align: right; }
  .bar { flex: 1; height: 10px; background: #21262d; border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; border-radius: 5px; transition: width 0.08s linear; }
  #mic-fill { background: #41d17a; }
  #play-fill { background: #2d7ff9; }
  .meter { display: flex; gap: 18px; font-size: 12px; color: #8b949e; }
  #log { width: 100%; height: 130px; overflow-y: auto; background: #090d12; border-radius: 10px;
         padding: 8px 10px; font-size: 11px; color: #7d8590; font-family: ui-monospace, monospace; }
  #log .t { color: #484f58; margin-right: 6px; }
  #log .ev-ok { color: #41d17a; }
  #log .ev-info { color: #7da2ff; }
  #log .ev-warn { color: #e6a23c; }
</style>
</head>
<body>
<h1>ChanneLLM 全双工语音</h1>
<div class="state"><span id="dot" class="dot"></span><span id="state-text">未连接</span></div>
<button id="toggle">开始对话</button>
<div id="vp-row" style="display:none;width:100%;align-items:center;justify-content:center;gap:10px;
     background:#161b22;border-radius:12px;padding:8px 12px">
  <span id="vp-status" style="font-size:13px;color:#8b949e"></span>
  <button id="enroll-btn" style="font-size:13px;padding:6px 16px;border-radius:16px;background:#238636">录入声纹</button>
</div>
<div id="reply">（回复文本显示在这里）</div>
<div class="bars">
  <div class="bar-row"><span class="bar-label">麦克风</span>
    <div class="bar"><div id="mic-fill" class="bar-fill"></div></div></div>
  <div class="bar-row"><span class="bar-label">播放</span>
    <div class="bar"><div id="play-fill" class="bar-fill"></div></div>
    <span id="buf-ms" style="width:56px"></span></div>
</div>
<div id="latency-card" style="width:100%;text-align:center;background:#101a2e;border-radius:12px;
     padding:10px;display:none">
  <div style="font-size:12px;color:#8b949e">端到端延迟(话音结束→首个回复音频)</div>
  <div id="latency" style="font-size:30px;font-weight:700;color:#7da2ff">--</div>
  <div id="latency-hist" style="font-size:11px;color:#7d8590;min-height:14px"></div>
</div>
<div class="meter">
  <span id="up">↑ 0.0s</span>
  <span id="down">↓ 0.0s</span>
  <span id="epoch">epoch -</span>
</div>
<div id="log"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const toggleBtn = $("toggle"), dotEl = $("dot"), stateTextEl = $("state-text");
const replyEl = $("reply"), upEl = $("up"), downEl = $("down"), epochEl = $("epoch");
const micFill = $("mic-fill"), playFill = $("play-fill"), bufMs = $("buf-ms"), logEl = $("log");
const vpRow = $("vp-row"), vpStatus = $("vp-status"), enrollBtn = $("enroll-btn");
let enrolling = false, enrollTimer = null;

let ws = null, audioCtx = null, micStream = null, captureNode = null, micSource = null;
let playbackNode = null, running = false, maxEpoch = -1, sentSamples = 0, recvSamples = 0;
// 端到端延迟测量:电平 VAD 判定话音结束 → 首个回复音频到达
let voiced = false, silenceStart = null, lastVoicedAt = null, voiceEndAt = null;
let e2ePending = false, latencies = [];
const VOICE_ON = 0.03, VOICE_OFF_MS = 700;
const latencyCard = $("latency-card"), latencyEl = $("latency"), latencyHist = $("latency-hist");

function log(text, cls) {
  const line = document.createElement("div");
  const t = new Date().toTimeString().slice(0, 8);
  line.innerHTML = `<span class="t">${t}</span><span class="${cls || ""}">${text}</span>`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function setState(kind, text) {
  dotEl.className = "dot " + kind;
  stateTextEl.textContent = text;
}

function setEnrollUI(active, statusText) {
  enrolling = active;
  enrollBtn.textContent = active ? "完成录入" : "录入声纹";
  enrollBtn.style.background = active ? "#9e6a03" : "#238636";
  if (statusText) vpStatus.textContent = statusText;
  if (enrollTimer) { clearTimeout(enrollTimer); enrollTimer = null; }
  if (active) enrollTimer = setTimeout(() => {
    if (enrolling && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "enroll_end" }));
  }, 10000);
}
enrollBtn.addEventListener("click", () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: enrolling ? "enroll_end" : "enroll_start" }));
  if (!enrolling) setEnrollUI(true, "录入中…请持续说话(≥3 秒)");
});

async function start() {
  if (!window.isSecureContext) {
    setState("error", "非安全上下文");
    log("麦克风/AudioWorklet 需要 HTTPS 或 localhost。请安装 CA 证书后用 https 访问。", "ev-warn");
    return;
  }
  setState("connecting", "连接中…");
  log("建立 WebSocket …", "ev-info");
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";

  audioCtx = new AudioContext();
  if (!audioCtx.audioWorklet) {
    setState("error", "浏览器过旧");
    log("当前浏览器不支持 AudioWorklet。", "ev-warn");
    return;
  }
  // iOS/Safari 的 AudioContext 即使在手势中创建也可能 suspended,必须显式
  // resume,否则 worklet 永不调度、收到音频也无声。
  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }
  log(`AudioContext ${audioCtx.state} @${audioCtx.sampleRate}Hz`, "ev-info");
  await audioCtx.audioWorklet.addModule("audio-worklet.js");

  playbackNode = new AudioWorkletNode(audioCtx, "playback-processor");
  playbackNode.connect(audioCtx.destination);
  playbackNode.port.onmessage = (e) => {
    const s = e.data;
    if (s.type !== "state") return;
    playFill.style.width = Math.min(100, s.level * 250) + "%";
    bufMs.textContent = s.bufferedMs + "ms";
    if (s.playing && running) setState("speaking", "模型在说话…(可直接插话打断)");
    else if (running && ws && ws.readyState === WebSocket.OPEN) setState("listening", "已连接,说话即可");
  };

  setState("connecting", "请求麦克风权限…");
  log("请求麦克风权限 …", "ev-info");
  // autoGainControl 关闭:自动增益会把很轻的环境音放大到被误判为说话。
  // 保留回声消除与降噪;人声偏小可靠近麦克风或调高说话音量。
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false },
  });
  log("麦克风已开启", "ev-ok");
  micSource = audioCtx.createMediaStreamSource(micStream);
  captureNode = new AudioWorkletNode(audioCtx, "capture-processor");
  captureNode.port.onmessage = (e) => {
    const d = e.data;
    if (d.type === "level") {
      micFill.style.width = Math.min(100, d.value * 300) + "%";
      const now = performance.now();
      if (d.value > VOICE_ON) {
        voiced = true;
        silenceStart = null;
        lastVoicedAt = now;
        e2ePending = false;      // 用户(重新)开口,本轮测量作废
        voiceEndAt = null;
      } else if (voiced) {
        if (silenceStart === null) silenceStart = now;
        if (now - silenceStart > VOICE_OFF_MS) {
          voiced = false;
          voiceEndAt = lastVoicedAt;
          e2ePending = true;
          log("检测到话音结束,计时中…", "ev-info");
        }
      }
      return;
    }
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(d.buf);
      sentSamples += d.buf.byteLength / 2;
      upEl.textContent = `↑ ${(sentSamples / 16000).toFixed(1)}s`;
    }
  };
  micSource.connect(captureNode);

  ws.onopen = () => {
    running = true;
    setState("listening", "已连接,说话即可");
    toggleBtn.textContent = "结束对话";
    toggleBtn.classList.add("stop");
    log("WebSocket 已连接", "ev-ok");
  };
  ws.onclose = (e) => {
    log(`连接关闭 code=${e.code} ${e.reason || ""}`, e.code === 1000 ? "ev-info" : "ev-warn");
    stop(true);
  };
  ws.onerror = () => { setState("error", "连接出错"); log("WebSocket 错误", "ev-warn"); };
  ws.onmessage = (e) => {
    if (typeof e.data === "string") {
      const msg = JSON.parse(e.data);
      if (msg.type === "clear") {
        playbackNode.port.postMessage({ type: "clear" });
        log("打断:清空播放缓冲", "ev-info");
      } else if (msg.type === "turn") {
        maxEpoch = msg.epoch;
        epochEl.textContent = `epoch ${msg.epoch}`;
        log(`回合开始 epoch=${msg.epoch}`, "ev-info");
      } else if (msg.type === "reply") {
        replyEl.textContent = msg.text || "";
        log(`回复文本: ${msg.text}`, "ev-ok");
      } else if (msg.type === "voiceprint") {
        vpRow.style.display = "flex";
        vpStatus.textContent = msg.enrolled ? "声纹已录入 ✓(环境音将被过滤)" : "未录入声纹(环境音可能打断回复)";
        log(msg.enrolled ? "声纹已加载" : "声纹未录入,可点击『录入声纹』", "ev-info");
      } else if (msg.type === "enroll_started") {
        setEnrollUI(true, "录入中…请持续说话(≥3 秒)");
      } else if (msg.type === "enrolled") {
        setEnrollUI(false, "声纹已录入 ✓(环境音将被过滤)");
        log(`声纹录入完成(${msg.voiced_s}s 有效语音)`, "ev-ok");
      } else if (msg.type === "enroll_failed") {
        setEnrollUI(false, msg.reason === "too_short"
          ? `录入失败:有效语音仅 ${msg.voiced_s}s,请重录(≥1.5s)` : "录入失败,请重试");
        log(`声纹录入失败: ${msg.reason}`, "ev-warn");
      } else if (msg.type === "gate") {
        const label = { open: "声纹确认,放行你的语音", muted: "声纹过滤:环境音被拦截",
                        dropped: "短促声音未及确认,已忽略" }[msg.state] || msg.state;
        log(label, msg.state === "muted" ? "ev-warn" : "ev-info");
      }
      return;
    }
    const view = new DataView(e.data);
    const epoch = view.getUint16(0, true);
    if (epoch < maxEpoch) return;
    if (recvSamples === 0) log("收到首个回复音频,开始播放", "ev-ok");
    if (e2ePending && voiceEndAt !== null) {
      const lat = Math.round(performance.now() - voiceEndAt);
      latencies.push(lat);
      e2ePending = false;
      latencyCard.style.display = "block";
      latencyEl.textContent = lat + " ms";
      latencyHist.textContent = "历史: " + latencies.slice(-5).join(" / ") + " ms";
      log(`端到端延迟 ${lat}ms(话音结束→首个音频到达)`, "ev-ok");
    }
    maxEpoch = epoch;
    const buf = e.data.slice(2);
    playbackNode.port.postMessage({ type: "push", buf }, [buf]);
    recvSamples += buf.byteLength / 2;
    downEl.textContent = `↓ ${(recvSamples / 24000).toFixed(1)}s`;
  };
}

function stop(fromServer) {
  running = false;
  if (enrollTimer) { clearTimeout(enrollTimer); enrollTimer = null; }
  enrolling = false;
  if (captureNode) { captureNode.disconnect(); captureNode.port.close(); captureNode = null; }
  if (micSource) { micSource.disconnect(); micSource = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (playbackNode) { playbackNode.disconnect(); playbackNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (ws && !fromServer) { ws.close(); }
  ws = null;
  toggleBtn.textContent = "开始对话";
  toggleBtn.classList.remove("stop");
  micFill.style.width = "0%";
  playFill.style.width = "0%";
  bufMs.textContent = "";
  if (!fromServer) setState("", "已结束");
}

toggleBtn.addEventListener("click", () => {
  if (running || ws) { stop(false); }
  else { start().catch(err => { setState("error", "启动失败"); log(`启动失败: ${err.message}`, "ev-warn"); }); }
});
</script>
</body>
</html>
