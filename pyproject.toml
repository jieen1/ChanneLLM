[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channellm"
version = "0.1.0"
description = "ChanneLLM — 单卡 SM120 自研全双工语音 runtime(MiniCPM-o 4.5 端到端,sparkinfer 内核)"
readme = "README.md"
requires-python = ">=3.10"

# 核心层(L0-L4)的纯 CPU 依赖:测量、事件存储、音频分块等基础设施可在无 GPU 环境开发与测试。
dependencies = [
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
# --- SM120 版本契约 ---------------------------------------------------------
# 与 qwen-sm120-runtime(BlackweLLM)共享 SM120 环境经验,在其参考环境上验证过:
# RTX PRO 6000 Blackwell Max-Q 96GB,driver 610.47,CUDA 13.x。
# torch 精确钉版;sparkinfer 以 editable 方式从 fork 安装(见 scripts/setup_env.sh),
# 因为它是本项目共同深度优化的内核面,不作为 PyPI 依赖声明。
cuda = [
  "torch==2.13.0",
  "triton>=3.6,<4",
  "transformers>=5,<6",
  "huggingface_hub>=1,<2",
  "safetensors>=0.7,<1",
]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

# 官方 MiniCPM-o 推理路径(P0 基线)的附加依赖:权重内 modeling 代码的
# lazy import 会被 transformers 的 import 检查器在加载时强制要求。
# numba 下限 0.59:更早版本(0.53)无 py3.12 wheel 且与 numpy 2 不兼容,
# 镜像源元数据可能把 librosa 解析到老 numba,必须显式钉住。
omni = [
  "pillow>=10,<12",
  "librosa>=0.10,<1",
  "numba>=0.59",
  "tqdm>=4.66,<5",
  "torchvision>=0.28,<1",  # processing_minicpmo 注册 image processor 需要
  # minicpmo-utils[all] 不在这里声明:它的元数据钉 transformers<4.53、
  # librosa==0.9.0 等,会把主栈拖回旧版本。其 stepaudio2 Token2wav 实际
  # 只用 transformers 稳定 API(AutoTokenizer/AutoConfig),与 5.x 兼容 ——
  # setup_env.sh 用 --no-deps 安装并显式补真实依赖(见该脚本)。
  "setuptools>=75,<81",  # stepaudio2/librosa 用 pkg_resources,setuptools 81+ 已移除
]

[tool.setuptools.packages.find]
include = ["channellm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# third_party 是钉版 submodule(sparkinfer fork), lint 归 fork 自己管
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# UP042/UP046 需要 py311+/py312+ 语法,与 requires-python>=3.10 冲突
ignore = ["UP042", "UP046"]
